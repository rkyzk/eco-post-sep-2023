{% extends "blog/base.html" %}
{% block content %}
{% load crispy_forms_tags %}
<div class="container form-section">
    <div class="col-lg-8 offset-lg-2">
        <h2 class="mt-5 mb-4 page-title"><i class="fa-regular fa-pen-to-square big-space-right"></i>記事を投稿</h2>
        <p class=>環境を守るための活動、アイデアなどをシェアされたい方は記事を投稿ください。
        </p>
        <form method="post" class="mt-5" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form | crispy }}
            <p class="mt-2"><em>編集者が不適切と判断した記事は断りなく削除させていただきますのでご了承ください。</em>
            </p>
            <button type="submit" class="blue-btn mt-2" name="save" value="draft">下書きとして保存</button>
            <button type="submit" class="blue-btn mt-2 btn-right" name="publish" value="complete">投稿</button>
        </form>
    </div>
</div>
{% endblock content %}
